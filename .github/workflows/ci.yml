name: ci

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev ninja-build protobuf-compiler
      - name: Configure workspace
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build workspace
        run: cmake --build build
      - name: Test workspace
        run: ctest --test-dir build --output-on-failure

  product-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and boundary-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev ninja-build protobuf-compiler ripgrep
      - name: Verify standalone product tree
        run: tools/verify-sync-boundary.sh
