# PDCM P0 daemon configuration.
# Provider library paths are intentionally not configurable.
target=fpga
endpoint=/run/pdcm/pdcm.sock
provider_call_timeout_ms=1000
shutdown_grace_ms=5000
max_sessions=64
max_outstanding_requests_per_session=32
max_watches_per_session=64
max_subscriptions_per_session=32
max_frame_bytes=4194304
